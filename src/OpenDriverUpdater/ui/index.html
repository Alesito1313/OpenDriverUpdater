<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>OpenDriverUpdater</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app" id="app">

    <!-- Barra superior: material translúcido que aparece al desplazar -->
    <header class="toolbar" id="toolbar">
      <div class="toolbar-title">
        <h1 class="large-title" id="title">Drivers</h1>
        <p class="subtitle" id="subtitle">Analizando tu PC…</p>
      </div>
      <div class="toolbar-actions">
        <button class="btn btn-plain" id="btn-export" data-press disabled>
          <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 3v9m0 0-3.5-3.5M10 12l3.5-3.5M4 14.5V16a1 1 0 0 0 1 1h10a1 1 0 0 0 1-1v-1.5"/></svg>
          <span>Exportar informe</span>
        </button>
        <button class="btn btn-plain" id="btn-rescan" data-press disabled>
          <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M16 10a6 6 0 1 1-1.76-4.24M16 4v3.5h-3.5"/></svg>
          <span>Buscar de nuevo</span>
        </button>
      </div>
    </header>

    <!-- Controles: filtro segmentado + búsqueda -->
    <div class="controls" id="controls" hidden>
      <div class="segmented" id="segmented" role="tablist" aria-label="Filtrar drivers">
        <span class="segmented-thumb" id="segmented-thumb"></span>
        <button role="tab" data-filter="all" aria-selected="true">Todos <span class="count" data-count="all"></span></button>
        <button role="tab" data-filter="updates" aria-selected="false">Actualizaciones <span class="count" data-count="updates"></span></button>
        <button role="tab" data-filter="ok" aria-selected="false">Al día <span class="count" data-count="ok"></span></button>
        <button role="tab" data-filter="none" aria-selected="false">Sin datos <span class="count" data-count="none"></span></button>
      </div>
      <label class="search">
        <svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="9" cy="9" r="5.5"/><path d="m13.2 13.2 3.3 3.3"/></svg>
        <input id="search" type="search" placeholder="Buscar dispositivo, fabricante o versión" autocomplete="off" spellcheck="false">
      </label>
    </div>

    <div class="banner" id="banner" hidden>
      <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 7v4m0 2.5v.01M8.6 3.6 2.4 14.4A1.6 1.6 0 0 0 3.8 16.8h12.4a1.6 1.6 0 0 0 1.4-2.4L11.4 3.6a1.6 1.6 0 0 0-2.8 0Z"/></svg>
      <span id="banner-text"></span>
      <button class="banner-close" id="banner-close" data-press aria-label="Cerrar aviso">
        <svg viewBox="0 0 20 20"><path d="m6 6 8 8m0-8-8 8"/></svg>
      </button>
    </div>

    <!-- Lista desplazable con rebote elástico en los bordes -->
    <main class="scroller" id="scroller">
      <div class="scroll-content" id="scroll-content">
        <div id="list" class="list" aria-live="polite"></div>
      </div>
    </main>

    <!-- Estado de análisis -->
    <section class="scan" id="scan" aria-live="polite">
      <div class="scan-card">
        <div class="scan-glyph" aria-hidden="true">
          <svg viewBox="0 0 48 48"><rect x="12" y="12" width="24" height="24" rx="5"/><path d="M18 4v6m6-6v6m6-6v6M18 38v6m6-6v6m6-6v6M4 18h6m-6 6h6m-6 6h6M38 18h6m-6 6h6m-6 6h6"/></svg>
        </div>
        <h2 class="scan-title" id="scan-title">Analizando tu PC</h2>
        <p class="scan-message" id="scan-message">Leyendo los componentes del equipo…</p>
        <div class="progress" aria-hidden="true"><div class="progress-fill" id="scan-fill"></div></div>
        <ol class="steps" id="steps">
          <li data-step="devices"><span class="step-dot"></span>Componentes del equipo</li>
          <li data-step="sources"><span class="step-dot"></span>Fuentes oficiales <span class="step-meta" id="step-sources-meta"></span></li>
          <li data-step="compare"><span class="step-dot"></span>Comparación de versiones</li>
        </ol>
        <button class="btn btn-tinted" id="btn-retry" data-press hidden>Reintentar</button>
      </div>
    </section>

    <!-- Barra de acción flotante -->
    <div class="action-bar" id="action-bar" aria-hidden="true">
      <div class="action-bar-text">
        <strong id="action-count">0 seleccionados</strong>
        <span id="action-meta"></span>
      </div>
      <button class="btn btn-plain" id="btn-clear" data-press>Desmarcar</button>
      <button class="btn btn-primary" id="btn-update" data-press>Actualizar</button>
    </div>

    <!-- Hoja inferior (detalles, confirmación, progreso, resultado) -->
    <div class="scrim" id="scrim"></div>
    <section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-hidden="true">
      <div class="sheet-grabber" id="sheet-grabber"><span></span></div>
      <div class="sheet-body" id="sheet-body"></div>
    </section>

    <div class="toast" id="toast" role="status"></div>
  </div>

  <script src="spring.js"></script>
  <script src="app.js"></script>
</body>
</html>
